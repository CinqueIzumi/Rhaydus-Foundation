# Shared nl.rhaydus detekt baseline, bundled in nl.rhaydus:detekt-rules.
#
# Consume it with `buildUponDefaultConfig = true` and `config.from(<this file>)`; layer app-specific
# thresholds (Room/DAO counts, network-client exception policy, etc.) in the app's own override file.
# It carries only calibrations that every nl.rhaydus app wants: the Compose/TOAD/Koin conventions, the
# guard-clause style, snake_case package segments, and the custom crash-safety ruleset. The mechanizable
# layout rules are owned by nl.rhaydus:ktlint-rules, so detekt's `formatting` ruleset stays off here.

config:
  validation: true
  warningsAsErrors: false

# Custom rules from nl.rhaydus:detekt-rules (added to the detektPlugins classpath). Requires full
# analysis mode (the `detekt<Target>` tasks), so it is skipped on a light run.
rhaydus:
  UnguardedFlowTerminalRead:
    active: true
    # The rule guards PRODUCTION crash-safety: an unguarded `Flow.first()` on a stream that completes
    # empty throws where a user can see it. In a test, that same call is the assertion - `first()`
    # failing loudly when nothing is emitted is precisely what the test is for, and the remedy the rule
    # advises (`firstOrNull()` + a default) would make a non-emitting flow silently assert against the
    # default instead. So the rule is excluded from test sources, matching detekt's own policy for the
    # rules whose advice does not transfer to test code.
    excludes: ['**/*Test/**', '**/test/**']
  NoReflection:
    active: true
    # A test may look a class up by name to assert on it; R8 never runs over test sources. An app adds its
    # own debug and tooling source sets to this list, which replaces rather than merges.
    excludes: ['**/*Test/**', '**/test/**']
  FileLevelDpProperty:
    active: true
    # A test fixture may hoist a dp value; the rule guards render code.
    excludes: ['**/*Test/**', '**/test/**']
  RawSpacingDp:
    active: true
    # allowedValues: ['0', '64', '96'] and tokenFiles: ['Spacing.kt'] are the defaults; an app overrides
    # them here to match its token scale.
    excludes: ['**/*Test/**', '**/test/**']
  RawCornerDp:
    active: true
    # allowedValues: ['0'] and tokenFiles: ['Corners.kt'] are the defaults.
    excludes: ['**/*Test/**', '**/test/**']
  UiModelBuiltInComposable:
    active: true
    # A test builds models freely. An app adds its previews, galleries and debug source sets to this list,
    # which replaces rather than merges.
    excludes: ['**/*Test/**', '**/test/**']
  InlineMockkStub:
    active: true
    includes: ['**/*Test/**', '**/test/**']
  UseCaseRunCatching:
    active: true
    # The convention reaches production use-case files; a test may call runCatching directly.
    includes: ['**/*UseCase*.kt']
    excludes: ['**/*Test/**', '**/test/**']
  NoRawLogging:
    active: true
  InlineFullyQualifiedReference:
    active: true
    # rootPackages and exemptPackageSegments are configurable; an app lists the generated-code package
    # segments whose names collide in exemptPackageSegments.
  NestedCommentInKDoc:
    active: true
  TestMissingArrangeActAssert:
    active: true
    includes: ['**/*Test/**', '**/test/**']

# Note: detekt's `formatting` ruleset (the ktlint wrapper) is deliberately NOT on the classpath - the
# mechanizable layout rules are owned by nl.rhaydus:ktlint-rules. So there is no `formatting:` block here;
# do not add the detekt-formatting plugin alongside this config.

# ---------------------------------------------------------------------------------------------------
# Test-source excludes.
#
# detekt ships an `excludes` list on the rules whose advice does not apply to test code: backticked test
# names are idiomatic (`FunctionNaming`), `!!` on a fixture is fine (`UnsafeCallOnNullableType`), a bare
# `throw` as a stub is fine, and so on. That list hardcodes source-set names (`test`, `jvmTest`,
# `androidUnitTest`, ...) and does not know AGP 9's `androidHostTest`, nor any custom `<target>Test` set.
# Overriding `excludes` REPLACES rather than merges, so each affected rule restates the list here as
# '**/*Test/**' (every source set ending in `Test`) plus '**/test/**' (the plain `test` source set).
# ---------------------------------------------------------------------------------------------------
comments:
  KDocReferencesNonPublicProperty:
    excludes: ['**/*Test/**', '**/test/**']
  UndocumentedPublicClass:
    excludes: ['**/*Test/**', '**/test/**']
  UndocumentedPublicFunction:
    excludes: ['**/*Test/**', '**/test/**']
  UndocumentedPublicProperty:
    excludes: ['**/*Test/**', '**/test/**']

performance:
  ForEachOnRange:
    excludes: ['**/*Test/**', '**/test/**']
  SpreadOperator:
    excludes: ['**/*Test/**', '**/test/**']

# ---------------------------------------------------------------------------------------------------
# Type-resolution calibration.
#
# Type-resolved rules need `--analysis-mode full` (the Gradle plugin's `detekt<Target>` tasks); on a
# light run they are skipped.
# ---------------------------------------------------------------------------------------------------
potential-bugs:
  LateinitUsage:
    excludes: ['**/*Test/**', '**/test/**']
  UnsafeCallOnNullableType:
    excludes: ['**/*Test/**', '**/test/**']
  IgnoredReturnValue:
    # A mockk `verify { repository.observe() }` block returns Unit, so the `Flow` it names reads as a
    # dropped result although the call itself is what the test verifies.
    excludes: ['**/*Test/**', '**/test/**']

coroutines:
  InjectDispatcher:
    # The DI module that *provides* the dispatchers is the one place they are named by construction;
    # everything downstream injects `AppDispatchers` from it, which is what this rule wants.
    excludes: ['**/di/**']

exceptions:
  InstanceOfCheckForException:
    excludes: ['**/*Test/**', '**/test/**']
  ThrowingExceptionsWithoutMessageOrCause:
    excludes: ['**/*Test/**', '**/test/**']
  TooGenericExceptionCaught:
    excludes: ['**/*Test/**', '**/test/**']

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable', 'Preview', 'StandardPreview']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable', 'Preview', 'StandardPreview']
  TooManyFunctions:
    ignoreAnnotated: ['Composable', 'Preview', 'StandardPreview']
    excludes: ['**/*Test/**', '**/test/**']
  StringLiteralDuplication:
    excludes: ['**/*Test/**', '**/test/**']
  LongParameterList:
    # TOAD *ScreenModel / *Dependencies inject many use cases via Koin; a parameter object is not
    # idiomatic for constructor DI, so the constructor threshold is generous.
    allowedConstructorParameters: 30
    ignoreAnnotated: ['Composable', 'Preview', 'StandardPreview']
  LargeClass:
    # A screen file is a Voyager Screen plus its private @Composables - large by design.
    allowedLines: 2500

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable', 'Preview', 'StandardPreview']
    excludes: ['**/*Test/**', '**/test/**']
  TopLevelPropertyNaming:
    ignoreAnnotated: ['Composable', 'Preview', 'StandardPreview']
  PackageNaming:
    # Module/package names use snake_case segments (e.g. feature.book_detail).
    packagePattern: '[a-z][a-z0-9]*(_[a-z0-9]+)*(\.[a-z][a-z0-9]*(_[a-z0-9]+)*)*'

style:
  ForbiddenSuppress:
    # A suppression of a contract rule defeats the contract, so it is itself a finding. Fix the code, or
    # restructure it so the rule no longer applies.
    active: true
    # Every rule in the `rhaydus` ruleset, plus the built-in null-safety contract.
    rules:
      - 'UnguardedFlowTerminalRead'
      - 'NoReflection'
      - 'FileLevelDpProperty'
      - 'RawSpacingDp'
      - 'RawCornerDp'
      - 'UiModelBuiltInComposable'
      - 'InlineMockkStub'
      - 'UseCaseRunCatching'
      - 'NoRawLogging'
      - 'InlineFullyQualifiedReference'
      - 'NestedCommentInKDoc'
      - 'TestMissingArrangeActAssert'
      - 'UnsafeCallOnNullableType'
  MagicNumber:
    # Compose dp/sp/alpha/weight literals saturate this rule with noise.
    active: false
    excludes: ['**/*Test/**', '**/test/**', '**/*.kts']
  ReturnCount:
    max: 8
    excludeGuardClauses: true
  MaxLineLength:
    maxLineLength: 140
  UnusedPrivateFunction:
    ignoreAnnotated: ['Composable', 'Preview', 'StandardPreview']
